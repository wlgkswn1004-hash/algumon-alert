name: algumon
on:
  workflow_dispatch:
    inputs:
      send:
        description: "텔레그램 발송까지 테스트"
        type: boolean
        default: false
  schedule:
    - cron: "*/10 * * * *"   # 수집 (알구몬 첫 페이지가 약 16분치라 10분 간격)
    - cron: "0 0,12 * * *"   # 발송: 한국 09시/21시
permissions:
  contents: write
concurrency: algumon
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 crawl.py collect
      - name: save deals.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add deals.json
          git diff --cached --quiet || (git commit -m "data" && git push)
      - if: github.event.schedule == '0 0,12 * * *' || inputs.send
        run: python3 crawl.py send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WINDOW_HOURS: ${{ inputs.send && '1' || '' }}
